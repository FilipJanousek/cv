services:
  angular-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angular-app
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - angular_node_modules:/app/node_modules
    environment:
      - NG_CLI_ANALYTICS=false
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

volumes:
  angular_node_modules: